# Runs the project's shell syntax checks on pull requests and on pushes to develop.
name: test

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Install completion shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Shell syntax checks
        run: make test
