name: test
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y zsh fish tcsh dbus python3 shellcheck
      - run: make test
      - run: make lint
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        image: ['bash:4.4', 'alpine:3.22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check portable shell environments
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TEST_IMAGE" sh -ec '
            apk add --no-cache bash make git openssh-client dbus python3 zsh fish tcsh coreutils
            bash --version
            make test
          '
  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1
        with:
          copyback: false
          prepare: pkg install -y bash gmake git dbus python3 zsh fish tcsh
          run: gmake test
